steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.web
      - --build-arg
      - APP_DIR=${_APP_DIR}
      - --build-arg
      - APP_NAME=${_APP_NAME}
      - --build-arg
      - NEXT_PUBLIC_API_URL=${_NEXT_PUBLIC_API_URL}
      - --build-arg
      - NEXT_PUBLIC_WS_URL=${_NEXT_PUBLIC_WS_URL}
      - --build-arg
      - NEXT_PUBLIC_HUB_URL=${_NEXT_PUBLIC_HUB_URL}
      - --build-arg
      - NEXT_PUBLIC_OPERATIONS_WEB_URL=${_NEXT_PUBLIC_OPERATIONS_WEB_URL}
      - --build-arg
      - NEXT_PUBLIC_POS_WEB_URL=${_NEXT_PUBLIC_POS_WEB_URL}
      - --build-arg
      - NEXT_PUBLIC_KDS_WEB_URL=${_NEXT_PUBLIC_KDS_WEB_URL}
      - --build-arg
      - NEXT_PUBLIC_CAPTAIN_WEB_URL=${_NEXT_PUBLIC_CAPTAIN_WEB_URL}
      - -t
      - ${_IMAGE}
      - .
images:
  - ${_IMAGE}
timeout: 1800s
options:
  machineType: E2_HIGHCPU_8
substitutions:
  _APP_DIR: apps/kds-web
  _APP_NAME: "@kaana/kds-web"
  _IMAGE: asia-south1-docker.pkg.dev/PROJECT/kaana-docker/kaana-kds-web:latest
  _NEXT_PUBLIC_API_URL: http://localhost:4000/api
  _NEXT_PUBLIC_WS_URL: http://localhost:4000/events
  _NEXT_PUBLIC_HUB_URL: http://localhost:4100
  _NEXT_PUBLIC_OPERATIONS_WEB_URL: http://localhost:3010
  _NEXT_PUBLIC_POS_WEB_URL: http://localhost:3001
  _NEXT_PUBLIC_KDS_WEB_URL: http://localhost:3002
  _NEXT_PUBLIC_CAPTAIN_WEB_URL: http://localhost:3003
