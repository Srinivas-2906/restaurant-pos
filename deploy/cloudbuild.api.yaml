steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.api
      - -t
      - ${_IMAGE}
      - .
images:
  - ${_IMAGE}
timeout: 1800s
options:
  machineType: E2_HIGHCPU_8
substitutions:
  _IMAGE: asia-south1-docker.pkg.dev/PROJECT/kaana-docker/kaana-api:latest
